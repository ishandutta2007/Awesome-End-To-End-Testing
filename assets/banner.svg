<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>

    <style>
      /* Dynamic animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes beaconRing {
        0% { r: 4px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }
      @keyframes gradientShift {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #ec4899; }
        100% { stop-color: #38bdf8; }
      }

      .pulse-bg {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-pill {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-pill-alt {
        animation: floatAlt 6s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashMove 3s linear infinite;
      }
      .radar-pulse {
        animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        transform-origin: center;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .body-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Pulsing Glow Blobs (strictly in background) -->
  <circle class="pulse-bg" cx="180" cy="90" r="140" fill="url(#glow-cyan)" />
  <circle class="pulse-bg" cx="820" cy="220" r="160" fill="url(#glow-purple)" />

  <!-- Tech Grid Overlay -->
  <rect width="1000" height="320" rx="16" fill="url(#grid)" />

  <!-- Dynamic Background Data Flow / Circuit Lines -->
  <g opacity="0.45">
    <path class="flow-line" d="M 50 80 Q 220 20 400 80 T 800 80 T 950 40" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flow-line" d="M 50 240 Q 240 290 480 230 T 780 250 T 950 260" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <path class="flow-line" d="M 120 20 L 120 300" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <path class="flow-line" d="M 880 20 L 880 300" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Interactive Dynamic Beacon Nodes in background -->
  <g transform="translate(120, 80)">
    <circle class="radar-pulse" cx="0" cy="0" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>
  <g transform="translate(880, 240)">
    <circle class="radar-pulse" cx="0" cy="0" r="4" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#c084fc" />
  </g>

  <!-- Background Decorative Dynamic Pills (Framing the borders, outside text area) -->
  <g class="floating-pill" opacity="0.85">
    <rect x="50" y="24" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <circle cx="66" cy="38" r="4" fill="#34d399" />
    <text x="78" y="43" fill="#94a3b8" font-size="11" class="body-text" font-weight="600">CI/CD INTEGRATED</text>
  </g>

  <g class="floating-pill-alt" opacity="0.85">
    <rect x="815" y="24" width="135" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.7"/>
    <circle cx="831" cy="38" r="4" fill="#a855f7" />
    <text x="843" y="43" fill="#cbd5e1" font-size="11" class="body-text" font-weight="600">AI-AGENT DRIVEN</text>
  </g>

  <!-- ================= FOREGROUND (Crisp, High Contrast, Guaranteed Clear) ================= -->
  
  <!-- Subtle Header Tag -->
  <g transform="translate(500, 75)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="url(#cyan-violet)" stroke-width="1.5" />
    <text text-anchor="middle" y="5" fill="#38bdf8" font-size="11.5" class="body-text" font-weight="700" letter-spacing="2">
      🧪 QUALITY ENGINEERING ECOSYSTEM
    </text>
  </g>

  <!-- Main Hero Title -->
  <!-- Drop shadow for text clarity -->
  <text text-anchor="middle" x="500" y="142" fill="#030712" font-size="44" class="title-text" opacity="0.8" dy="2">
    AWESOME END-TO-END TESTING
  </text>
  <text text-anchor="middle" x="500" y="140" fill="url(#cyan-violet)" font-size="44" class="title-text">
    AWESOME END-TO-END TESTING
  </text>

  <!-- Subtitle -->
  <text text-anchor="middle" x="500" y="184" fill="#f8fafc" font-size="18" class="body-text" font-weight="600" letter-spacing="0.2">
    Curated SaaS Platforms, AI Quality Agents &amp; Open-Source Automation Engines
  </text>

  <!-- Detailed Tagline -->
  <text text-anchor="middle" x="500" y="214" fill="#94a3b8" font-size="14" class="body-text">
    Playwright • Cypress • Selenium • Appium • Visual Regression • Self-Healing Agents • Device Clouds
  </text>

  <!-- Category Bottom Badges -->
  <g transform="translate(500, 266)">
    <!-- Pill 1 -->
    <g transform="translate(-255, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#38bdf8" font-size="12" class="body-text" font-weight="600">🌐 Cross-Browser</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-85, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#34d399" font-size="12" class="body-text" font-weight="600">🤖 AI-Native QA</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(85, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#c084fc" font-size="12" class="body-text" font-weight="600">📱 Mobile E2E</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(255, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#f59e0b" font-size="12" class="body-text" font-weight="600">⚡ Zero Lock-In</text>
    </g>
  </g>

  <!-- Sleek Border Gradient -->
  <rect x="0.5" y="0.5" width="999" height="319" rx="16" fill="none" stroke="url(#cyan-violet)" stroke-width="1.2" opacity="0.6"/>
</svg>
